name: Reusable Release - Rust Binary

# pnos 生态共享发版工作流（可复用）。
# 由各项目 release.yml 通过 `uses: PandaNetOS/pnos-spec/.github/workflows/reusable-release-rust-binary.yml@main` 调用。
#
# 与旧版（PandaNetOS meta 仓）的差异：
#   - 不再 checkout 旧标准库 pandanetos、不再做 `../PandaNetOS` path 依赖改写。
#     生态只允许新标准库 pnos，且 pnos 以 git 依赖引入，构建机无需额外 Checkout。
#     （旧版那条 `sed -i 's|../PandaNetOS|PandaNetOS|g'` 因未转义点号会破坏
#      git 依赖 URL，去掉后该类问题自然消失。）
#   - Linux 目标产物为 `{binary}-linux-{arch}.tar.gz`（对齐 pnos-store 的 app.yml
#      约定与 pnos-runtime 安装器的 .tar.gz 解压要求）。
#   - Windows / macOS 保持裸二进制命名。
#   - 已移除「通知下游项目重建」（dispatch-downstream）能力：该能力只服务于
#     pcdn-keeper，现已停用；发版后的下游同步由各项目自己的 release.yml 负责
#     （如 pk 发版后通知 pnos-store 同步商店版本号）。

on:
  workflow_call:
    inputs:
      binary_name:
        description: "二进制名称（如 spde、pk）"
        required: true
        type: string
      project_name:
        description: "项目名称（如 SPDE、PK）"
        required: true
        type: string
      build_matrix:
        description: "构建平台矩阵（JSON 格式）"
        required: false
        type: string
        default: '[{"os":"windows-latest","target":"x86_64-pc-windows-msvc","artifact_suffix":"x86_64-windows.exe","cross":false},{"os":"ubuntu-latest","target":"x86_64-unknown-linux-musl","artifact_suffix":"x86_64-linux-musl","cross":true},{"os":"ubuntu-latest","target":"aarch64-unknown-linux-musl","artifact_suffix":"aarch64-linux-musl","cross":true},{"os":"macos-latest","target":"x86_64-apple-darwin","artifact_suffix":"x86_64-macos","cross":false},{"os":"macos-latest","target":"aarch64-apple-darwin","artifact_suffix":"aarch64-macos","cross":false}]'
      enable_sccache:
        description: "是否启用 sccache 缓存"
        required: false
        type: boolean
        default: true
      version:
        description: "版本号（如 1.3.0），由 Tag Guard 通过 workflow_dispatch 传递"
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(inputs.build_matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install sccache
        if: ${{ inputs.enable_sccache && !matrix.cross }}
        uses: mozilla-actions/sccache-action@v0.0.6

      - name: Cache sccache
        if: ${{ inputs.enable_sccache && !matrix.cross }}
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/sccache
            ~/Library/Caches/Mozilla.sccache
            ~/AppData/Local/Mozilla/sccache/cache
          key: sccache-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            sccache-${{ matrix.target }}-

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@cross

      - name: Setup perl for Windows
        if: matrix.os == 'windows-latest'
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: '5.36'

      - name: Build with cross (Linux musl)
        if: matrix.cross
        shell: bash
        run: |
          cross build --release --target ${{ matrix.target }}

      - name: Build with sccache (Windows/macOS)
        if: ${{ !matrix.cross }}
        env:
          RUSTC_WRAPPER: sccache
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary
        id: package
        shell: bash
        run: |
          VERSION="${{ inputs.version || github.ref_name }}"
          BIN_NAME="${{ inputs.binary_name }}"
          TARGET="${{ matrix.target }}"
          bin="target/${TARGET}/release/${BIN_NAME}"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            bin="${bin}.exe"
          fi

          if [[ "$TARGET" == *-linux-* ]]; then
            # Linux：打包为 {binary}-linux-{arch}.tar.gz（tar 根目录内含可执行二进制）
            # 与 pnos-store 的 app.yml 约定一致（如 pk-linux-amd64.tar.gz），
            # 且满足 pnos-runtime 安装器对 .tar.gz 的解压要求。
            case "$TARGET" in
              x86_64-*)  ARCH="amd64" ;;
              aarch64-*) ARCH="arm64" ;;
              *)         ARCH="$(echo "$TARGET" | cut -d- -f1)" ;;
            esac
            artifact_name="${BIN_NAME}-linux-${ARCH}.tar.gz"
            pkg_dir="$(mktemp -d)"
            cp "$bin" "${pkg_dir}/${BIN_NAME}"
            chmod +x "${pkg_dir}/${BIN_NAME}"
            tar -czf "$artifact_name" -C "$pkg_dir" "$BIN_NAME"
            rm -rf "$pkg_dir"
          else
            # Windows / macOS：保持原有裸二进制命名
            artifact_name="${BIN_NAME}-v${VERSION}-${{ matrix.artifact_suffix }}"
            cp "$bin" "$artifact_name"
            if [ "${{ matrix.os }}" != "windows-latest" ]; then
              chmod +x "$artifact_name"
            fi
          fi

          echo "artifact_name=$artifact_name" >> $GITHUB_OUTPUT
          echo "Packaged: $artifact_name"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: ${{ steps.package.outputs.artifact_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ inputs.project_name }} v${{ inputs.version || github.ref_name }}
          tag_name: v${{ inputs.version || github.ref_name }}
          generate_release_notes: true
          files: ${{ inputs.binary_name }}-*
