[package]
name = "pnos"
version = "0.1.0"
edition = "2021"
description = "pnos 系统级标准库 - 统一错误码、响应格式、应用模型、容器配置、配置加载、结构化日志"
license = "MIT"
repository = "https://github.com/PandaNetOS/pnos-spec"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
time = { version = "0.3", features = ["serde", "macros", "formatting"] }
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
