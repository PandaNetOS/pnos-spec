[package]
name = "pnos"
version = "1.0.0"
edition = "2021"
description = "pnos 统一通信标准库 - 组件注册发现、服务发现、事件协议、任务调度、能力自描述、统一错误码与响应格式"
license = "MIT"
repository = "https://github.com/PandaNetOS/pnos-spec"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
time = { version = "0.3", features = ["serde", "macros", "formatting", "parsing"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
